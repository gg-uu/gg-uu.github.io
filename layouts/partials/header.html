<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <span class="brand-mark">&gt;_</span>
      <span class="brand-name">{{ .Site.Title }}</span>
      {{ with .Site.Params.subtitle }}<span class="brand-sub">{{ . }}</span>{{ end }}
    </a>
    <nav class="site-nav">
      {{ range .Site.Params.menu.main }}
        <a class="nav-link" href="{{ .url }}">{{ .name }}</a>
      {{ end }}
      {{ if .Site.Params.showSearch }}
        <button class="nav-icon-btn" id="search-toggle" aria-label="搜索" title="搜索 (Ctrl+K)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      {{ end }}
      <button class="nav-icon-btn" id="theme-toggle" aria-label="切换主题" title="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
