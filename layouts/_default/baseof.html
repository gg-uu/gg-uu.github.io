<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "zh" }}" data-theme="{{ with .Site.Params.defaultTheme }}{{ . }}{{ else }}dark{{ end }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <canvas class="fx-canvas" id="fx-canvas"></canvas>
  {{ partial "header.html" . }}
  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ if .Site.Params.showSearch }}
    {{ partial "search-modal.html" . }}
  {{ end }}
  <button class="back-top" id="back-top" aria-label="回到顶部" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
  </button>
  <script src="{{ "js/main.js" | relURL }}"></script>
  <script src="{{ "js/fx.js" | relURL }}"></script>
  {{ if .Site.Params.showSearch }}
    <script src="{{ "js/fuse.min.js" | relURL }}"></script>
    <script src="{{ "js/search.js" | relURL }}"></script>
  {{ end }}
</body>
</html>
